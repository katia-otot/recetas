services:
  recetas:
    build:
      context: ./web
    image: recetas:latest
    container_name: recetas
    restart: unless-stopped
    ports:
      # The cloud firewall only allows 80/443/5926 from the internet.
      # 80 is pixelweb; 443 is the only free public HTTP(S) port.
      - "443:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/recetas.db
      PORT: "3000"
    volumes:
      - ./data/recetas.db:/app/data/recetas.db
    mem_limit: 768m
